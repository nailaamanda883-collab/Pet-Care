<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetCare | Tambah Hewan</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <h1>PetCare</h1>

        <button
            type="button"
            id="nav-toggle-btn"
            class="nav-toggle-label"
            aria-label="Menu">
            &#9776;
        </button>

        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Data Hewan</a></li>
                <li><a href="tambah.html">Tambah Hewan</a></li>
                <li><a href="../pemilik/list.html">Data Pemilik</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>

            <h2>Tambah Hewan</h2>

            <form id="form-tambah">

                <p>
                    <label for="nama">Nama Hewan</label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        required>
                </p>

                <p>
                    <label for="jenis">Jenis Hewan</label>

                    <select
                        id="jenis"
                        name="jenis"
                        required>

                        <option value="">-- Pilih Jenis --</option>
                        <option value="Kucing">Kucing</option>
                        <option value="Anjing">Anjing</option>
                        <option value="Kelinci">Kelinci</option>
                        <option value="Hamster">Hamster</option>

                    </select>
                </p>

                <p>
                    <label for="ras">Ras</label>

                    <input
                        type="text"
                        id="ras"
                        name="ras"
                        required>
                </p>

                <p>
                    <label for="usia">Usia (Tahun)</label>

                    <input
                        type="number"
                        id="usia"
                        name="usia"
                        min="0"
                        required>
                </p>

                <p>
                    <label for="pemilik">Nama Pemilik</label>

                    <input
                        type="text"
                        id="pemilik"
                        name="pemilik"
                        required>
                </p>

                <p>
                    <button type="submit">
                        Simpan
                    </button>
                </p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 PetCare &mdash; Jobsheet 6</p>
    </footer>

    <script src="../assets/js/app.js"></script>

</body>
</html>
